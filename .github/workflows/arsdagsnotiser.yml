name: Årsdagsnotiser

on:
  schedule:
    # Actions-cron är i UTC, och schemalagda körningar ligger i kö: uppmätt 2,5
    # till 3,5 timmars försening. Därför många försök med start långt före målet,
    # i stället för fyra nära det. Skriptet skickar bara när klockan i Stockholm
    # är 16–20 och minns per prenumeration vilket datum den senast fick något, så
    # den första körning som landar i fönstret gör jobbet och resten avstår.
    - cron: "10 10 * * *"
    - cron: "10 11 * * *"
    - cron: "10 12 * * *"
    - cron: "10 13 * * *"
    - cron: "10 14 * * *"
    - cron: "10 15 * * *"
    - cron: "10 16 * * *"
    - cron: "10 17 * * *"
    - cron: "10 18 * * *"
  workflow_dispatch:
    inputs:
      tvinga:
        description: "Kör även om klockan inte är 16 i Stockholm"
        type: boolean
        default: true
      torrkorning:
        description: "Visa vad som skulle skickas, utan att skicka"
        type: boolean
        default: true
      provnotis:
        description: "Skicka en RIKTIG provnotis till alla enheter (struntar i årsdagar och torrkörning)"
        type: boolean
        default: false

concurrency:
  group: arsdagsnotiser
  cancel-in-progress: false

jobs:
  skicka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install web-push@3 --no-save
      - run: node scripts/send-arsdagar.js
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          TVINGA: ${{ inputs.tvinga && '1' || '' }}
          TORRKORNING: ${{ inputs.torrkorning && '1' || '' }}
          PROVNOTIS: ${{ inputs.provnotis && '1' || '' }}
