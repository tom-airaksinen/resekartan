<meta name="theme-color" content="#101B24" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icon-192.png" sizes="192x192">

<!-- Typsnittsfilerna kommer härifrån, inte från googleapis – utan den här raden
     öppnas anslutningen först när css:en har lästs. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- display=optional, inte swap: swap är just instruktionen att byta in
     typsnittet när det kommit, och det är bytet som blinkar till vid start.
     Med optional används reservtypsnittet bara om filen inte redan finns, och
     då byts den aldrig mitt i. Service workern cachar filerna, så från andra
     starten och framåt ritas rätt typsnitt direkt. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=optional">
<style>
:root{
  --ocean:#D3E2EA; --ocean-2:#C2D8E4; --land:#EDE9E0; --land-line:#FBFAF7; --coast:#FFFFFF;
  --home:#F0C4A9; --home-line:#C2552C;
  --visited:#2B4F84; --visited-2:#3A6098; --visited-line:#1E3A63; --planned:#8FA5C4;
  --v1:#8CAED6; --v2:#5E8BBF; --v3:#3A6098; --v4:#1E3A63;
  --pin:#1B2733; --pin-ring:#FBFAF7; --pin-side:#5B6B78;
  --surface:#FBFAF7; --surface-2:#F1EEE7; --line:#DDD8CC; --field:#FFFFFF;
  --ink:#1B2733; --ink-2:#5B6B78; --ink-3:#8A96A0;
  --accent:#E4572E; --accent-ink:#FBFAF7;
  --danger:#B3261E;
  --p1:#2F6FD6; --p2:#C4457E; --p3:#B8741A; --p4:#1F9A78; --p5:#7A5AC9; --p6:#3D7D2E;
  --guest-bg:#E7E2D6; --guest-ink:#5B6B78;
  --shadow:0 -6px 24px rgba(27,39,51,.12);
  --map-label:#5B6B78; --sea-label:#8AA7B8;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-theme="rosa"]){
  --ocean:#101B24; --ocean-2:#0A1218; --land:#26333D; --land-line:#17232C; --coast:#38495699;
  --home:#6B3A2A; --home-line:#F0774F;
  --visited:#5E86C2; --visited-2:#4A709F; --visited-line:#7FA3D8; --planned:#3F5773;
  --v1:#37527A; --v2:#4E74AB; --v3:#6E9AD4; --v4:#9CBFEC;
  --pin:#ECEFF1; --pin-ring:#17232C; --pin-side:#AEBAC4;
  --surface:#17232C; --surface-2:#1F2D37; --line:#2E3D48; --field:#0F1A22;
  --ink:#ECEFF1; --ink-2:#AEBAC4; --ink-3:#7D8B96;
  --accent:#F0774F; --accent-ink:#17232C;
  --danger:#F2B8B5;
  --p1:#5B8FE6; --p2:#D4699A; --p3:#BF7F22; --p4:#3FA88C; --p5:#8F76D4; --p6:#6BA23F;
  --guest-bg:#2B3A45; --guest-ink:#AEBAC4;
  --shadow:0 -6px 24px rgba(0,0,0,.4);
  --map-label:#AEBAC4; --sea-label:#5A7183;
}}
:root[data-theme="dark"]{
  --ocean:#101B24; --ocean-2:#0A1218; --land:#26333D; --land-line:#17232C; --coast:#38495699;
  --home:#6B3A2A; --home-line:#F0774F;
  --visited:#5E86C2; --visited-2:#4A709F; --visited-line:#7FA3D8; --planned:#3F5773;
  --v1:#37527A; --v2:#4E74AB; --v3:#6E9AD4; --v4:#9CBFEC;
  --pin:#ECEFF1; --pin-ring:#17232C; --pin-side:#AEBAC4;
  --surface:#17232C; --surface-2:#1F2D37; --line:#2E3D48; --field:#0F1A22;
  --ink:#ECEFF1; --ink-2:#AEBAC4; --ink-3:#7D8B96;
  --accent:#F0774F; --accent-ink:#17232C;
  --danger:#F2B8B5;
  --p1:#5B8FE6; --p2:#D4699A; --p3:#BF7F22; --p4:#3FA88C; --p5:#8F76D4; --p6:#6BA23F;
  --guest-bg:#2B3A45; --guest-ink:#AEBAC4;
  --shadow:0 -6px 24px rgba(0,0,0,.4);
  --map-label:#AEBAC4; --sea-label:#5A7183;
}
/* Hedvigs tema. Bara ljust – väljs det gäller det oavsett vad systemet säger. */
:root[data-theme="rosa"]{
  --ocean:#F7D9E1; --ocean-2:#F1C7D3; --land:#FFF8F2; --land-line:#FFFFFF; --coast:#FFFFFF;
  --home:#FFC9D6; --home-line:#B8305E;
  --visited:#D6336C; --visited-2:#E8558A; --visited-line:#A31D50; --planned:#F2A5BC;
  --v1:#F09CB8; --v2:#E2618F; --v3:#C42A62; --v4:#8E1440;
  --pin:#3B1F33; --pin-ring:#FFF6F7; --pin-side:#9C6A80;
  --surface:#FFF6F7; --surface-2:#FCE7EC; --line:#F3D3DB; --field:#FFFFFF;
  --ink:#3B1F33; --ink-2:#8A5F73; --ink-3:#B48FA0;
  --accent:#E0407A; --accent-ink:#FFF6F7;
  --danger:#B3261E;
  --p1:#5A7BDB; --p2:#E0407A; --p3:#E08A20; --p4:#2FB58F; --p5:#8B5AC9; --p6:#3D8D3E;
  --guest-bg:#F8E1E7; --guest-ink:#8A5F73;
  --shadow:0 -6px 24px rgba(184,48,94,.18);
  --map-label:#8A5F73; --sea-label:#C98BA4;
}
:root[data-theme="rosa"] .btn{border-radius:999px}

*{box-sizing:border-box}
/* manipulation tar bort iOS dubbeltapp-zoom men behåller panorering och nyp,
   så sidan inte kan fastna inzoomad. Kartan sätter egen touch-action. */
html,body,#app,#tabs,.view,.sheet-body,.edbody,.months,#imBody{touch-action:manipulation}
html,body{height:100%;margin:0}
@supports (height: 100dvh){ html,body{height:100dvh} }
body{background:var(--ocean);color:var(--ink);font:15px/1.45 Figtree,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",Figtree,"Helvetica Neue",Arial,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* ---------- Lås ---------- */
#lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--ocean);padding:24px;
  transition:opacity .26s ease}
#lock.klar{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){ #lock{transition:none} }
#lock .box{width:100%;max-width:340px;background:var(--surface);border-radius:18px;padding:28px 22px;box-shadow:0 12px 40px rgba(27,39,51,.16);text-align:center}
#lock h1{font-size:24px;margin-bottom:4px}
#lock p{color:var(--ink-2);font-size:14px;margin:0 0 14px}
#lock .logo{display:block;width:72px;height:72px;margin:0 auto 14px;border-radius:22.4%;overflow:hidden;
  box-shadow:0 3px 10px rgba(27,39,51,.18)}
#lock .logo svg{display:block;width:100%;height:100%}
#lock form{display:flex;flex-direction:column;gap:10px;margin-top:4px}
#lock .err{color:var(--danger);font-size:13px;min-height:18px;margin:6px 0 0}
/* Raden ligger alltid kvar och tar sin plats – dyker den upp först när den
   behövs växer kortet och allt innehåll hoppar till mitt i starten. */
#lock .status{color:var(--ink-2);font-size:13px;margin:10px 0 0;min-height:18px;
  display:flex;align-items:center;justify-content:center;gap:8px;visibility:hidden}
#lock .status.pa{visibility:visible}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.4s}}

/* ---------- Formulärelement ---------- */
/* Varje ny inputtyp måste in här. Saknas den får fältet webbläsarens egen stil
   och blir ett litet streck bland de andra – så gick det för url-fältet. */
input[type=text],input[type=date],input[type=password],input[type=number],input[type=email],input[type=url],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--field);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.35}
textarea{resize:vertical;min-height:72px;line-height:1.45}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 4px}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* Ivald och urvald resenär ska gå att skilja åt på en armlängds avstånd, och
   inte bara på färg: den ivalda har personens färg i kanten, full styrka och en
   bock. Den urvalda är grå, tonad och har tom ring. */
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 8px 5px 5px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-3);font-size:14px;font-weight:500;
  transition:border-color .12s,background .12s,color .12s,opacity .12s}
.chip[aria-pressed="false"]{opacity:.7}
.chip .av{width:24px;height:24px;font-size:11px;filter:grayscale(1);opacity:.45}
.chip .tick{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;flex:none;
  border:1.5px solid var(--line);background:transparent}
.chip .tick svg{display:none;width:11px;height:11px;stroke:var(--surface);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chip[aria-pressed="true"]{opacity:1;color:var(--ink);font-weight:600;background:var(--surface-2);
  border-color:var(--pc,var(--accent));box-shadow:inset 0 0 0 1px var(--pc,var(--accent))}
.chip[aria-pressed="true"] .av{filter:none;opacity:1}
.chip[aria-pressed="true"] .tick{background:var(--pc,var(--accent));border-color:var(--pc,var(--accent))}
.chip[aria-pressed="true"] .tick svg{display:block}
.chip.plain{padding:6px 12px}
.check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.hint{font-size:12.5px;color:var(--ink-3);margin:4px 0 0}

/* ---------- Skelett ---------- */
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
#stage{position:relative;flex:1;min-height:0;min-width:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#map .sea{fill:url(#seaGrad)}
#map .coast{fill:none;stroke:var(--coast);stroke-linejoin:round;opacity:.9}
/* Ingen stroke-width här: CSS vinner över presentationsattribut, och bredden
   räknas fram per zoomnivå i rescale(). Sätts den här skalas linjerna med kartan. */
#map .land{fill:var(--land);stroke:var(--land-line)}
#map .land.home{fill:var(--home);stroke:var(--home-line)}
#map .land.visited{stroke:var(--visited-line)}
#map .land.v1{fill:var(--v1)} #map .land.v2{fill:var(--v2)} #map .land.v3{fill:var(--v3)} #map .land.v4{fill:var(--v4)}
#map .land.planned{fill:url(#hatch)}
#map .land.hit{cursor:pointer}
/* Ingen stroke-dasharray här. Den skalas per zoomnivå i rescale() och sätts som
   attribut, och CSS vinner över presentationsattribut – samma fälla som
   stroke-width. Med mönstret låst i CSS blev ett streck 3 × zoomen långt, och
   vid 170× syntes bara ett enda femhundra pixlar långt streck som slutade mitt
   i havet. */
#map .link{fill:none;stroke:var(--pin-side)}
#map .pin circle{fill:var(--pin);stroke:var(--pin-ring);cursor:pointer}
#map .pin.side circle{fill:var(--pin-side)}
#map .pin.city circle{fill:var(--visited);stroke:var(--pin-ring)}
#map .pin.planned circle{fill:var(--pin-ring);stroke:var(--pin)}
#map .pin.active circle{fill:var(--accent);stroke:var(--accent-ink)}
#map .pin.dim{opacity:.18}
#map .home-pin{cursor:pointer}
#map .home-pin circle{fill:var(--home-line);stroke:var(--land-line)}
#map .home-pin path{fill:none;stroke:var(--land-line);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
#map .clabel{fill:var(--map-label);font-family:Figtree,"Helvetica Neue",Arial,sans-serif;font-weight:600;paint-order:stroke;stroke:var(--land-line);stroke-linejoin:round;pointer-events:none}
#map .sealabel{fill:var(--sea-label);font-family:Figtree,"Helvetica Neue",Arial,sans-serif;font-style:italic;font-weight:400;text-anchor:middle;pointer-events:none}
#map .conlabel{fill:var(--map-label);font-family:Figtree,"Helvetica Neue",Arial,sans-serif;font-weight:500;text-anchor:middle;pointer-events:none;opacity:.8}
#map.picking{cursor:crosshair}
#map.picking .land,#map.picking .pin circle{cursor:crosshair}

/* ---------- Kartans överlägg ---------- */
body.no-top #top{display:none}
body.no-top #view-settings{padding-top:calc(12px + env(safe-area-inset-top,0px))}
/* align-items:flex-start är inte kosmetik: utan den sträcker sig raderna över
   hela scenen, och eftersom de har pointer-events:auto lägger de en osynlig yta
   ovanpå sidopanelens överkant – precis där Tillbaka-knappen sitter. */
#top{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:10px;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:calc(16px + env(safe-area-inset-left,0px));
  padding-right:calc(16px + env(safe-area-inset-right,0px))}
#top>*{pointer-events:auto}
.toprow{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:7px;background:var(--surface);padding:6px 12px 6px 7px;
  border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.08);max-width:100%;min-width:0}
.brandlogo{display:block;width:26px;height:26px;border-radius:8px;overflow:hidden;flex:none}
.brandlogo svg{display:block;width:100%;height:100%}
.brand h1{font-size:17px;font-weight:700;flex:none}
.brand .dot{color:var(--ink-3);flex:none}
.brand .sel{color:var(--ink-2);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand .chev{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .18s}
.brand[aria-expanded="true"] .chev{transform:rotate(180deg)}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.08);flex:none}
.iconbtn svg{width:19px;height:19px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed="true"] svg{stroke:var(--accent)}
.cloud{width:10px;height:10px;border-radius:50%;background:var(--ink-3);flex:none;box-shadow:0 0 0 3px var(--surface)}
.cloud.off{background:var(--danger)}
.whomenu{align-self:flex-start;background:var(--surface);border-radius:16px;padding:6px;
  box-shadow:0 8px 28px rgba(0,0,0,.18);min-width:232px;max-width:calc(100vw - 32px)}
.whomenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;
  font-size:15px;color:var(--ink);text-align:left}
.whomenu button:hover{background:var(--surface-2)}
.whomenu button .av{width:26px;height:26px;font-size:12px}
.whomenu button .tick{margin-left:auto;width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);
  display:grid;place-items:center;flex:none}
.whomenu button[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.whomenu button[aria-pressed="true"] .tick svg{display:block}
.whomenu button .tick svg{display:none;width:12px;height:12px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.whomenu hr{border:0;border-top:1px solid var(--line);margin:5px 8px}
.whomenu .lead{font-size:12.5px;color:var(--ink-3);padding:2px 10px 6px}
.av{display:inline-flex;align-items:center;justify-content:center;text-align:center;
  width:26px;height:26px;border-radius:50%;background:var(--pc,var(--ink-3));color:#fff;
  font:600 12px/1 "Bricolage Grotesque",sans-serif;flex:none;overflow:hidden}
/* Versalerna hamnar en aning högt i radboxen – skjut ned dem till optisk mitt */
.av>i{font-style:normal;line-height:1;transform:translateY(.07em)}
.av.guest{background:var(--guest-bg);color:var(--guest-ink);box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.avs .more{display:inline-grid;place-items:center;height:22px;min-width:22px;padding:0 5px;border-radius:999px;background:var(--guest-bg);color:var(--guest-ink);font:600 10px/1 "Bricolage Grotesque",sans-serif;margin-left:-6px;border:2px solid var(--surface)}
.zoom{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:calc(56px + env(safe-area-inset-top,0px));display:none;flex-direction:column;background:var(--surface);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden}
.zoom button{width:34px;height:34px;font-size:18px;line-height:1}
.zoom button+button{border-top:1px solid var(--line)}
.legend{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(var(--sheet-h, 0px) + 12px);transition:bottom .28s cubic-bezier(.2,.8,.2,1),opacity .2s;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);background:var(--surface);padding:8px 10px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.legend .l-h{background:var(--home);border:1px solid var(--home-line)} .legend .l-p{background:repeating-linear-gradient(135deg,var(--planned) 0 2px,var(--land) 2px 4px)} .legend .l-s{background:var(--pin-side);border-radius:50%}
.legend .l-ramp{display:flex;align-items:center}
.legend .l-ramp i{width:14px;margin:0;border-radius:0}
.legend .l-ramp i:first-of-type{margin-left:6px;border-radius:3px 0 0 3px}
.legend .l-ramp i:last-of-type{border-radius:0 3px 3px 0}
.legend .l-ramp em{font-style:normal;margin-left:7px;color:var(--ink-3);font-size:11px}
.legend .l-v1{background:var(--v1)} .legend .l-v2{background:var(--v2)} .legend .l-v3{background:var(--v3)} .legend .l-v4{background:var(--v4)}
#pickbar{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));bottom:16px;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:6}
#pickbar span{flex:1;font-size:14px}

/* ---------- Sök ---------- */
.srch{position:relative;min-width:0}
.srch .in{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;border-radius:999px;background:var(--field);border:1px solid var(--line)}
.srch .in:focus-within{border-color:var(--accent)}
.srch .in>svg{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.srch input{flex:1;min-width:0;height:100%;padding:0;border:0;border-radius:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.srch input::-webkit-search-cancel-button,.srch input::-webkit-search-decoration{-webkit-appearance:none}
.srch input:focus-visible{outline:none}
.srch .clr{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);flex:none}
.srch .clr svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.srch-res{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:8;background:var(--surface);border-radius:14px;
  box-shadow:0 8px 28px rgba(0,0,0,.18);max-height:min(52vh,400px);overflow-y:auto;overscroll-behavior:contain}
.srch-res [role=option]{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.srch-res [role=option]:last-child{border-bottom:0}
.srch-res [role=option][aria-selected="true"],.srch-res [role=option]:hover{background:var(--surface-2)}
.srch-res .flag{font-size:20px;line-height:1;text-align:center}
.srch-res b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch-res small{display:block;color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch-res mark{background:transparent;color:var(--accent)}
.srch-res .kind{font-size:11px;font-weight:600;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.srch-res .msg{margin:0;padding:12px 14px;font-size:13.5px;color:var(--ink-3)}
.view .srch{margin:0 0 14px}
/* På kartan: förstoringsglaset byter ut toppraden mot fältet */
#top .searchrow{display:none;align-items:center;gap:8px;width:100%;max-width:440px}
#top .searchrow .srch{flex:1}
#top .searchrow .in{border:0;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.08)}
#top .searchrow .cancel{flex:none;height:40px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.08);font-weight:600;color:var(--ink-2)}
#top.searching .toprow{display:none}
#top.searching .searchrow{display:flex}

/* ---------- Bottenark ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;
  box-shadow:var(--shadow);height:50%;display:flex;flex-direction:column;
  transition:height .28s cubic-bezier(.2,.8,.2,1);touch-action:none}
#sheet.dragging{transition:none}
#stage.dragging .legend{transition:none}
#stage.sheet-high .legend{opacity:0;pointer-events:none}
/* På telefonen tar rutan för mycket av kartan för att stå framme jämt – där
   fälls den upp med infoknappen. På större skärmar finns plats och den ligger
   kvar, så knappen behövs inte. */
@media (max-width:899px){
  .legend{display:none}
  body.visa-legend .legend{display:flex}
  /* Teckenförklaringen hör till kartan, så knappen har ingen verkan i de
     andra flikarna och ska inte stå kvar där. */
  body:not([data-tab="karta"]) #legendBtn{display:none}
}
@media (min-width:900px){ #legendBtn{display:none} }
.handle{flex:none;display:flex;align-items:center;justify-content:center;height:34px;width:100%;
  touch-action:none;cursor:grab}
.handle:active{cursor:grabbing}
.handle span{width:44px;height:5px;border-radius:3px;background:var(--line);transition:background .15s}
.handle:hover span,#sheet.dragging .handle span{background:var(--ink-3)}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:4px calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
@media (prefers-reduced-motion: reduce){#sheet{transition:none}}

/* ---------- Nyckeltal ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-bottom:6px}
.stat{background:var(--surface-2);border-radius:12px;padding:9px 8px;min-width:0}
.stat .num{font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2 .stat{padding:10px 12px}
.grid2 .stat span{white-space:normal}
@media (min-width:420px){ .stats{gap:8px} .stat{padding:10px 12px} .stat .num{font-size:24px} }

/* ---------- Reserader ---------- */
h2.sec{font-size:15px;color:var(--ink-2);font-weight:600;margin:16px 0 6px}
h2.sec:first-child{margin-top:8px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 6px}
.sechead h2{font-size:15px;color:var(--ink-2);font-weight:600}
.trip{display:grid;grid-template-columns:34px 1fr auto;gap:0 12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.trip:last-child{border-bottom:0}
.trip .flag{font-size:24px;line-height:1;text-align:center}
.trip b{display:block;font-weight:600}
.trip small{color:var(--ink-2);font-size:13px}
.trip .avs{display:flex}
.trip .avs .av{width:22px;height:22px;font-size:10px;margin-left:-6px;border:2px solid var(--surface)}
.trip.planned .flag{filter:grayscale(1);opacity:.7}
/* Resor får en liggande ruta – de flesta resebilder är liggande. Rader utan
   bild får samma ruta med flaggan i, så vänsterkanten blir rak i en blandad
   lista. Landraderna i Länder rör vi inte, de har aldrig bilder. */
.trip[data-trip]{grid-template-columns:96px 1fr auto;padding:12px 0}
.trip[data-trip] .flag{display:grid;place-items:center;width:96px;height:72px;border-radius:12px;
  background:var(--surface-2);font-size:30px}
/* Omslagsrutan ser likadan ut var den än används – reselistorna och landvyn */
.thumb{display:block;width:96px;height:72px;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.trip .rowflag{font-size:15px;margin-right:6px;vertical-align:1px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);vertical-align:1px;margin-left:6px}
.tag.side{background:transparent;border:1px dashed var(--ink-3)}
.home-badge{background:var(--home);color:var(--home-line);border:1px solid var(--home-line)}

/* ---------- Resedetalj ---------- */
/* Omslaget stort överst. Rutan har fast höjd redan innan bilden kommit, så
   sidan inte hoppar; miniatyren på 240 px ritas uppskalad och suddig medan de
   skarpa versionerna laddas, och blurren tas bort när den första är inne. */
/* Ett <button>, inte en div: herobilden är samma bild som första rutan i
   galleriet och öppnar visaren på samma sätt, så den ska svara på tryck,
   tabb och Enter utan egen kod. data-open="0" plockas upp av samma lyssnare
   som miniatyrerna. */
.triphero{position:relative;display:block;width:100%;aspect-ratio:3/2;max-height:34vh;
  margin:2px 0 12px;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.triphero:active{opacity:.94}
.triphero img{display:block;width:100%;height:100%;object-fit:cover;
  filter:blur(10px);transform:scale(1.07);transition:filter .3s ease}
.triphero.skarp img{filter:none;transform:none}
.triphero .spin{position:absolute;right:10px;bottom:10px;border-color:rgba(255,255,255,.45);border-top-color:#fff}
.triphero.skarp .spin{display:none}
@media (prefers-reduced-motion: reduce){.triphero img{transition:none}}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:500;padding:6px 0;margin-bottom:4px}
.detail h2,.country h2{font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.detail h2 .flag,.country h2 .flag{font-size:26px}
.meta{display:grid;grid-template-columns:20px 1fr;gap:6px 10px;color:var(--ink-2);font-size:14px;margin:8px 0 12px}
.meta svg{width:16px;height:16px;margin-top:2px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.meta .who-row{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--ink)}
.meta .who-row span{display:inline-flex;align-items:center;gap:5px;font-size:14px}
.meta .who-row .av{width:22px;height:22px;font-size:10px}
.note{margin:0 0 14px;max-width:60ch;color:var(--ink)}
.triplink{display:grid;grid-template-columns:22px 1fr 16px;gap:10px;align-items:center;margin:0 0 14px;
  padding:11px 12px;border-radius:12px;background:var(--surface-2);color:var(--ink);text-decoration:none}
.triplink b{display:block;font-weight:600;font-size:15px}
.triplink small{display:block;color:var(--ink-2);font-size:12.5px}
.triplink svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.triplink .ic{display:block;width:22px;height:22px;color:var(--ink-2)}
.triplink .ch{display:block;width:16px;height:16px;color:var(--ink-3)}
.stops{display:flex;flex-direction:column;gap:8px}
.stop{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.stop.side{background:transparent;border:1px dashed var(--line);margin-left:22px;position:relative}
.stop.side::before{content:"";position:absolute;left:-14px;top:50%;width:10px;border-top:1px dashed var(--ink-3)}
.stop .flag{font-size:22px;grid-row:span 2;align-self:center}
.stop b{font-weight:600}
.stop small{color:var(--ink-2);font-size:13px}
/* ---------- Bilder ---------- */
.photos{margin-top:18px}
.photos h3{font-size:15px;color:var(--ink-2);font-weight:600;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.photos h3 .cnt{font-weight:400;color:var(--ink-3);font-size:13px}
.grid-ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.grid-ph figure{margin:0;position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);
  touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* Utan callout:none öppnar iOS sin egen Dela/Spara-meny på långtryck, och då
   kommer draget aldrig igång. */
.grid-ph figure img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.grid-ph figure.drag{z-index:5;box-shadow:0 10px 26px rgba(0,0,0,.3);cursor:grabbing}
.grid-ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;-webkit-user-drag:none}
.grid-ph .cover{display:none;position:absolute;left:5px;bottom:5px;padding:2px 8px;border-radius:999px;
  background:rgba(27,39,51,.62);color:#fff;font-size:10.5px;font-weight:600;backdrop-filter:blur(4px)}
.grid-ph figure.hero .cover{display:block}
.addph{display:flex;align-items:center;justify-content:center;gap:7px;aspect-ratio:1;border-radius:10px;
  border:1.5px dashed var(--line);color:var(--ink-2);font-size:13px;font-weight:600;flex-direction:column;text-align:center;padding:6px}
.addph svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Inklistringsrutan är ett redigerbart fält, men ska varken visa markör eller
   se ut som ett textfält. Etiketten fångar inga tryck, så markören hamnar i
   rutan och systemets Klistra in-meny kommer fram på långtryck. */
/* Etiketten ligger utanför fältet, inte i det. Ett redigerbart fält med bara
   oredigerbart innehåll ger iOS ingenstans att sätta markören, och då erbjuds
   ingen Klistra in-meny på långtryck.
   16px är heller inget stilval: under det zoomar iOS in hela sidan vid fokus. */
.grid-ph .klistrawrap{position:relative;aspect-ratio:1}
.grid-ph .klistra{position:absolute;inset:0;border:1.5px dashed var(--line);border-radius:10px;
  font-size:16px;color:transparent;caret-color:var(--accent);cursor:pointer;overflow:hidden;
  -webkit-user-select:none;user-select:none}
/* Skrivfältsläget: markören syns och texten går att markera, så iOS meny kommer */
.grid-ph .klistra[contenteditable]{cursor:text;-webkit-user-select:text;user-select:text}
.grid-ph .klistra[contenteditable]:focus{outline:none;border-color:var(--accent);border-style:solid}
.grid-ph .klistra:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid-ph .klistra img{max-width:100%}
.grid-ph .klistraetikett{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;
  pointer-events:none;color:var(--ink-2);font-size:13px;font-weight:600;line-height:1.25}
.grid-ph .klistraetikett svg{width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.phlog{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--surface-2);
  font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text}
.ph-empty{padding:12px;border-radius:12px;border:1px dashed var(--line);color:var(--ink-3);font-size:13px}
.ph-busy{font-size:13px;color:var(--ink-2);margin:8px 0 0;display:flex;align-items:center;gap:8px}

#viewer{position:fixed;inset:0;z-index:80;background:rgba(10,18,24,.94);display:flex;flex-direction:column}
#viewer .vtop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;color:#fff}
#viewer .vtop span{font-size:14px;opacity:.75}
#viewer .vbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
#viewer .vbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* uppdateraVisare() sätter disabled på pilarna i ändarna, men utan den här
   regeln såg de likadana ut som en knapp som faktiskt gör något. */
#viewer .vbtn:disabled{background:rgba(255,255,255,.05);color:rgba(255,255,255,.28);cursor:default}
/* Tre rutor i ett spår: föregående, den man tittar på, och nästa. pan-y hindrar
   webbläsaren från att tolka svepet som sitt eget bakåtsvep. */
/* touch-action:none, inte pan-y. Med pan-y tar webbläsaren nypningen själv och
   zoomar hela sidan i stället för bilden – appen får aldrig se gesten. Här finns
   inget att skrolla, så vi äger alla fingrar på ytan. */
#viewer .vwrap{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}
#viewer .vtrack{position:absolute;inset:0;display:flex;will-change:transform;
  transform:translateX(-100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#viewer .vtrack.dragging{transition:none}
#viewer .vslide{flex:0 0 100%;padding:0 8px}
/* Fast ruta, inte bildens egen storlek. Förhandsbilden är 400 px och originalet
   flera gånger större; låter man bilden bestämma boxen ritas den först litet och
   hoppar sedan upp när originalet kommit – tydligast på stående bilder. */
#viewer img{display:block;width:100%;height:100%;object-fit:contain;transform-origin:center center;
  user-select:none;-webkit-user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
#viewer.zoomad .vslide{cursor:grab}
#viewer.zoomad .vslide:active{cursor:grabbing}
@media (prefers-reduced-motion: reduce){ #viewer .vtrack{transition:none} }
#viewer .vnav{flex:none;display:flex;justify-content:center;gap:16px;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.actions{display:flex;gap:10px;margin-top:16px}

/* ---------- Landvy ---------- */
.country p{color:var(--ink-2);margin:4px 0 8px}
.ctrip{border-top:1px solid var(--line);padding:12px 0}
.ctrip:first-of-type{border-top:0}
/* Hela kortet öppnar resan, inte bara raden längst ned */
.ctrip[data-trip]{cursor:pointer;margin:0 -8px;padding:12px 8px;border-radius:12px}
.ctrip[data-trip]:hover{background:var(--surface-2)}
.ctrip[data-trip]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* Samma liggande ruta som i reselistorna, med landets flagga när resan saknar
   bild – då blir vänsterkanten rak även när bara någon resa har foton. */
.ctrip .hdr{display:grid;grid-template-columns:96px 1fr auto;gap:0 12px;align-items:center}
.ctrip .hdr>span:nth-child(2){min-width:0}
.ctrip .hdr .flag{display:grid;place-items:center;width:96px;height:72px;border-radius:12px;
  background:var(--surface-2);font-size:30px;line-height:1}
.ctrip .hdr b{font-weight:600}
.ctrip .when{display:block;color:var(--ink-2);font-size:13px;margin-top:1px}
.ctrip ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ctrip li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:baseline;font-size:14px}
.ctrip li>div{min-width:0}
.ctrip li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--visited);transform:translateY(-1px)}
.ctrip li.home-city::before{background:var(--home-line)}
.ctrip li b{font-weight:600}
.ctrip li span{color:var(--ink-2)}
.ctrip .more{display:inline-block;margin-top:8px;color:var(--accent);font-weight:600;font-size:13px}

/* ---------- Helskärmsvyer ---------- */
.view{position:absolute;inset:0;background:var(--surface);overflow-y:auto;
  padding:calc(64px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
.view>h1{font-size:26px;margin:6px 0 12px}
.viewhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 12px}
.viewhead h1{font-size:26px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.grid2 .stat .num{font-size:32px}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.bar{display:grid;grid-template-columns:26px minmax(0,auto) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:11ch}
.bar .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--pc);border-radius:4px}
.bar .val{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:8ch;text-align:right}
.years{display:flex;gap:6px;align-items:flex-end;height:110px;margin-top:8px;padding-top:6px}
.years>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12px;color:var(--ink-2)}
.years .col{width:100%;max-width:38px;background:var(--visited);border-radius:4px 4px 0 0}
.years .v{font-variant-numeric:tabular-nums;color:var(--ink)}
.toplist{display:flex;flex-direction:column;gap:2px}
.topitem{display:grid;grid-template-columns:18px 24px 1fr auto;gap:10px;align-items:center;
  width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}
.topitem:last-child{border-bottom:0}
.topitem .rank{font:600 13px/1 "Bricolage Grotesque",sans-serif;color:var(--ink-3);text-align:center}
.topitem .flag{font-size:20px;line-height:1}
.topitem .nm{min-width:0}
.topitem .nm b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topitem .nm small{display:block;color:var(--ink-2);font-size:12.5px}
.topitem .km{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap}
.topitem .track{grid-column:3 / -1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:-2px}
.topitem .fill{display:block;height:100%;background:var(--visited);border-radius:2px}
.facts{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px;margin-top:8px}
.facts{align-items:start}
.facts dt{color:var(--ink-2)} .facts dd{margin:0;text-align:right;font-weight:500}
/* Topp tre: ettan i full svärta, tvåan och trean dämpade och mindre */
.facts dd.top3{display:flex;flex-direction:column;gap:3px;font-weight:400}
/* Barnkombinatorn är inte kosmetik: utan den träffar :not(:first-child) även
   .v-spannen inne i raderna, och då dämpas ettans siffra också. */
.facts dd.top3>span:first-child{font-weight:600}
.facts dd.top3>span:not(:first-child){color:var(--ink-2);font-size:13px}
.facts dd.top3 .v{color:var(--ink-3);font-variant-numeric:tabular-nums;margin-left:3px}
.example{font-size:12px;color:var(--ink-3);margin:14px 0 0}

/* ---------- Redigering ---------- */
#editor{position:fixed;inset:0;z-index:30;background:var(--surface);display:flex;flex-direction:column}
.edhead{flex:none;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.edhead h2{flex:1;font-size:18px}
.edbody{flex:1;overflow-y:auto;padding:16px 16px 24px}
.edbody>*{max-width:720px;margin-left:auto;margin-right:auto}
.edfoot .btnrow,.edfoot .formerr{max-width:720px;margin-left:auto;margin-right:auto}
.edfoot{flex:none;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.edfoot .btn{flex:1}
.stopcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surface)}
.stopcard.side{border-style:dashed;background:transparent}
.stopcard .sc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stopcard .sc-head .flag{font-size:22px}
.stopcard .sc-head b{flex:1;font-size:15px}
.placerow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.placerow .pr-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.placerow .coord{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.placerow .coord.missing{color:var(--danger)}
/* Väljer man en träff är det bara koordinatraden som ändrar sig. Den får lysa
   till ett ögonblick, annars ser trycket ut att inte ha gjort något. */
.placerow .coord.vald{color:var(--accent);font-weight:600}
/* Felsökningslogg för ortsökningen, se SOK_LOG_ON i app.js */
/* Notislägen: ett val i tre steg, inte fyra kryssrutor */
.lagen{display:grid;gap:8px;margin-bottom:10px}
.lagen button{display:grid;grid-template-columns:1fr 20px;gap:2px 10px;align-items:center;text-align:left;
  padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink-2)}
.lagen button b{font-weight:600;color:var(--ink)}
.lagen button small{grid-column:1;font-size:13px}
.lagen button[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--accent)}
.lagen .tick{grid-row:1/3;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--line);background:transparent}
.lagen .tick svg{display:none;width:12px;height:12px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lagen button[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.lagen button[aria-pressed="true"] .tick svg{display:block}
/* Årsdagsvyn: reseraden som vanligt, med årtalet över */
.arsrad{margin-bottom:2px}
.arsrad .ar{display:block;font-size:12.5px;font-weight:600;color:var(--accent);margin-top:10px}
.arsrad .trip{border-bottom:1px solid var(--line)}
.arsrad:last-child .trip{border-bottom:0}
.soklog{margin:14px 0 0;padding:8px 10px;border-radius:10px;background:var(--surface-2);
  color:var(--ink-2);font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre-wrap;word-break:break-word}
.iconbtn.sm{width:32px;height:32px;box-shadow:none;background:var(--surface-2)}
.iconbtn.sm svg{width:16px;height:16px}
.searchwrap{position:relative}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:240px;overflow-y:auto}
.results button{display:block;width:100%;text-align:left;padding:9px 12px;font-size:14px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button small{display:block;color:var(--ink-3);font-size:12px}
.results .msg{padding:10px 12px;font-size:13px;color:var(--ink-3)}
.subtle{color:var(--ink-2);font-size:13.5px;margin:0 0 14px}
.codebox{width:100%;font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);word-break:break-all;min-height:80px}

/* ---------- Landsökning ---------- */
.pickstep{display:flex;flex-direction:column;gap:12px}
.pickstep h3{font-size:19px}
.pickstep .lead{color:var(--ink-2);font-size:14px;margin:0}
.clist-search{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.copt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-size:15px}
.copt:hover,.copt:focus-visible{background:var(--surface-2)}
.copt .flag{font-size:22px;line-height:1}
.copt .sub{display:block;font-size:12px;color:var(--ink-3)}
.copt b{font-weight:500}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px}
.nores{color:var(--ink-3);font-size:14px;padding:10px 2px}

/* ---------- Datumväljare ---------- */
.datebtn{width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font:inherit}
.datebtn .ph{color:var(--ink-3)}
#cal{position:fixed;inset:0;z-index:40;background:var(--surface);display:flex;flex-direction:column}
#cal .edhead{border-bottom:1px solid var(--line)}
.calyears{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none;align-items:center;flex:none}
.calyears::-webkit-scrollbar{display:none}
.calyears button{flex:none;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
.calyears button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.months{flex:1;overflow-y:auto;padding:8px 16px 16px;display:grid;gap:8px 28px;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-content:start;
  max-width:1160px;margin:0 auto;width:100%}
.month{margin-bottom:10px;max-width:340px;width:100%;justify-self:center}
.month h4{font-size:15px;font-weight:600;margin:0 0 6px;text-align:center}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow span{text-align:center;font-size:11px;color:var(--ink-3);padding:2px 0}
.days button{aspect-ratio:1;max-height:46px;display:grid;place-items:center;font-size:14px;border-radius:9px;font-variant-numeric:tabular-nums}
.days button:disabled{color:var(--ink-3);opacity:.35;cursor:default}
.days .pad{visibility:hidden}
.days button.in{background:var(--surface-2);border-radius:0}
.days button.edge{background:var(--accent);color:var(--accent-ink);font-weight:700}
.days button.edge.s{border-radius:9px 0 0 9px}
.days button.edge.e{border-radius:0 9px 9px 0}
.days button.edge.one{border-radius:9px}
.days button.today{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.calfoot{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);max-width:1160px;margin:0 auto;width:100%}
.calyears{max-width:1160px;margin:0 auto;width:100%}
.calfoot .sum{flex:1;font-size:14px;color:var(--ink-2)}

/* ---------- Temaväljare ---------- */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tcard{position:relative;display:flex;flex-direction:column;gap:8px;padding:8px;
  border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.tcard[aria-pressed="true"]{border-color:var(--accent)}
.tcard .prev{display:block;height:64px;border-radius:9px;background:var(--t-sea);position:relative;overflow:hidden}
.tcard .prev i{position:absolute;display:block;border-radius:45% 55% 50% 50%}
.tcard .prev .l1{left:-8%;top:18%;width:58%;height:70%;background:var(--t-land)}
.tcard .prev .l2{left:58%;top:10%;width:30%;height:36%;background:var(--t-land)}
.tcard .prev .v1{left:20%;top:38%;width:18%;height:26%;background:var(--t-vis)}
.tcard .prev .v2{left:63%;top:22%;width:12%;height:18%;background:var(--t-vis)}
.tcard .prev .sh{position:absolute;left:12%;right:12%;bottom:0;height:34%;border-radius:8px 8px 0 0;
  background:var(--t-surf);border-radius:8px 8px 0 0}
.tcard .prev .sh::after{content:"";position:absolute;left:12%;top:30%;width:44%;height:13%;border-radius:3px;background:var(--t-acc)}
.tcard b{display:block;font-size:14px;font-weight:600}
.tcard small{display:block;font-size:12px;color:var(--ink-2)}
.tcard .tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);display:none;place-items:center}
.tcard[aria-pressed="true"] .tick{display:grid}
.tcard .tick svg{width:12px;height:12px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Personer ---------- */
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow input{flex:1;padding:7px 10px;font-size:16px}
.prow .role{font-size:12px;color:var(--ink-3);white-space:nowrap}
.addp{display:flex;gap:8px;margin-top:10px}
.addp input{flex:1}

/* ---------- Import ---------- */
#importer{position:fixed;inset:0;z-index:35;background:var(--surface);display:flex;flex-direction:column}
#imBody{flex:1;overflow-y:auto;padding:16px 16px 24px}
#imBody>*{max-width:760px;margin-left:auto;margin-right:auto}
#imBody textarea{min-height:190px;font-size:16px}
.imwarn{margin:0 0 10px;padding:9px 11px;border-radius:10px;background:var(--surface-2);
  color:var(--ink-2);font-size:13px;border-left:3px solid var(--accent)}
.imrow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;
  padding:11px 0;border-bottom:1px solid var(--line)}
.imrow:last-child{border-bottom:0}
.imrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:3px 0 0}
.imrow .who{display:block;font-weight:600;font-size:15px}
.imrow .src{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
.imrow .meta2{display:block;color:var(--ink-2);font-size:13px;margin-top:3px}
.imrow .flag{font-size:20px;line-height:1}
.imrow.bad .who{color:var(--ink-2)}
.imbadge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);margin-left:6px}
.imbadge.warn{background:transparent;border:1px dashed var(--ink-3)}
.imsum{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);margin:0 0 10px}
.imhelp{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:12px 14px}
.imhelp p{margin:0 0 9px}
.imhelp p:last-child{margin-bottom:0}
.imhelp b{color:var(--ink)}
.imhelp code{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}

/* ---------- Dialog och toast ---------- */
/* Frågerutan måste ligga över allt annat. Den kan öppnas från bildvisaren, och
   låg den under blev det som att papperskorgen inte gjorde något – frågan stod
   och väntade bakom bilden. */
#ask{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(27,39,51,.45);padding:24px}
#ask .box{width:100%;max-width:340px;background:var(--surface);border-radius:16px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#ask p{margin:0 0 16px;font-size:15px}
#ask .row{display:flex;gap:10px}
#ask .row .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:110;pointer-events:none;
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;
  box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}
.err-msg{color:var(--danger);font-size:13px;font-weight:500;margin:6px 0 0}
.field.bad input,.field.bad textarea,.field.bad .datebtn{border-color:var(--danger)}
.edfoot{flex-direction:column;gap:8px}
.edfoot .btnrow{display:flex;gap:10px;width:100%}
.edfoot .btnrow .btn{flex:1}
.edfoot .formerr{color:var(--danger);font-size:13.5px;font-weight:500;text-align:center;width:100%}

/* ---------- Flikrad ---------- */
#tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);position:relative;z-index:2;
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;
  font-size:10.5px;font-weight:500;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-selected="true"]{color:var(--ink)}
#tabs button[aria-selected="true"] svg{stroke:var(--accent)}

/* ---------- Desktop ---------- */
@media (min-width:900px){
  /* Panelens och flikradens bredd står på ett ställe. Allt som måste sluta före
     panelen räknar ut sig själv ur --panel, annars glider siffrorna isär.
     Panelen krymper med skärmen: på en iPad i liggande läge blev 420 px i
     överkant, och kartan är det man kom för. */
  :root{ --panel:clamp(340px, 32vw, 420px); --rail:68px; }
  #app{flex-direction:row}
  #stage{order:1}
  #sheet{left:auto;right:0;top:0;width:var(--panel);height:auto!important;border-radius:0;box-shadow:-6px 0 24px rgba(0,0,0,.08);border-left:1px solid var(--line)}
  .handle{display:none}
  .sheet-body{padding-top:16px}
  /* Toppraden ska aldrig nå in under sidopanelen */
  #top{right:calc(var(--panel) + 16px);flex-direction:row;align-items:center}
  /* Här finns plats: sökfältet står framme hela tiden bredvid namnet, utan knapp
     att slå på det med och utan Avbryt att stänga det med. Men det får krympa:
     med fast bredd svämmade raden över #top och la sig under panelen så fort
     namnet plus fältet blev bredare än utrymmet. */
  #searchBtn{display:none}
  #top .searchrow{display:flex;flex:1 1 220px;width:auto;max-width:300px;min-width:0}
  #top .searchrow .cancel{display:none}
  #top.searching .toprow{display:flex}
  /* Resenärsmenyn ligger kvar under namnet i stället för att ta plats i raden */
  .whomenu{position:absolute;top:100%;margin-top:2px;left:calc(16px + env(safe-area-inset-left,0px))}
  .zoom{display:flex;right:calc(var(--panel) + 16px);top:16px}
  #tabs{order:0;flex-direction:column;width:var(--rail);border-top:0;border-right:1px solid var(--line);justify-content:flex-start;padding-top:14px}
  #tabs button{flex:none;padding:12px 0;font-size:10px}
  .view{left:auto;width:var(--panel);border-left:1px solid var(--line);padding-top:16px}
  .stats{grid-auto-flow:row;grid-template-columns:1fr 1fr;overflow:visible}
  #editor{left:var(--rail)}
  #pickbar{right:calc(var(--panel) + 16px)}
}
