<meta charset="utf-8">
<title>Resekartan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D3E2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101B24" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Resekartan">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --ocean:#D3E2EA; --ocean-2:#C2D8E4; --land:#EDE9E0; --land-line:#FBFAF7; --coast:#FFFFFF;
  --home:#F0C4A9; --home-line:#C2552C;
  --visited:#2B4F84; --visited-2:#3A6098; --visited-line:#1E3A63; --planned:#8FA5C4;
  --pin:#1B2733; --pin-ring:#FBFAF7; --pin-side:#5B6B78;
  --surface:#FBFAF7; --surface-2:#F1EEE7; --line:#DDD8CC; --field:#FFFFFF;
  --ink:#1B2733; --ink-2:#5B6B78; --ink-3:#8A96A0;
  --accent:#E4572E; --accent-ink:#FBFAF7;
  --danger:#B3261E;
  --p1:#2F6FD6; --p2:#C4457E; --p3:#B8741A; --p4:#1F9A78; --p5:#7A5AC9; --p6:#3D7D2E;
  --guest-bg:#E7E2D6; --guest-ink:#5B6B78;
  --shadow:0 -6px 24px rgba(27,39,51,.12);
  --map-label:#5B6B78; --sea-label:#8AA7B8;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-theme="rosa"]){
  --ocean:#101B24; --ocean-2:#0A1218; --land:#26333D; --land-line:#17232C; --coast:#38495699;
  --home:#6B3A2A; --home-line:#F0774F;
  --visited:#5E86C2; --visited-2:#4A709F; --visited-line:#7FA3D8; --planned:#3F5773;
  --pin:#ECEFF1; --pin-ring:#17232C; --pin-side:#AEBAC4;
  --surface:#17232C; --surface-2:#1F2D37; --line:#2E3D48; --field:#0F1A22;
  --ink:#ECEFF1; --ink-2:#AEBAC4; --ink-3:#7D8B96;
  --accent:#F0774F; --accent-ink:#17232C;
  --danger:#F2B8B5;
  --p1:#5B8FE6; --p2:#D4699A; --p3:#BF7F22; --p4:#3FA88C; --p5:#8F76D4; --p6:#6BA23F;
  --guest-bg:#2B3A45; --guest-ink:#AEBAC4;
  --shadow:0 -6px 24px rgba(0,0,0,.4);
  --map-label:#AEBAC4; --sea-label:#5A7183;
}}
:root[data-theme="dark"]{
  --ocean:#101B24; --ocean-2:#0A1218; --land:#26333D; --land-line:#17232C; --coast:#38495699;
  --home:#6B3A2A; --home-line:#F0774F;
  --visited:#5E86C2; --visited-2:#4A709F; --visited-line:#7FA3D8; --planned:#3F5773;
  --pin:#ECEFF1; --pin-ring:#17232C; --pin-side:#AEBAC4;
  --surface:#17232C; --surface-2:#1F2D37; --line:#2E3D48; --field:#0F1A22;
  --ink:#ECEFF1; --ink-2:#AEBAC4; --ink-3:#7D8B96;
  --accent:#F0774F; --accent-ink:#17232C;
  --danger:#F2B8B5;
  --p1:#5B8FE6; --p2:#D4699A; --p3:#BF7F22; --p4:#3FA88C; --p5:#8F76D4; --p6:#6BA23F;
  --guest-bg:#2B3A45; --guest-ink:#AEBAC4;
  --shadow:0 -6px 24px rgba(0,0,0,.4);
  --map-label:#AEBAC4; --sea-label:#5A7183;
}
/* Hedvigs tema. Bara ljust – väljs det gäller det oavsett vad systemet säger. */
:root[data-theme="rosa"]{
  --ocean:#F7D9E1; --ocean-2:#F1C7D3; --land:#FFF8F2; --land-line:#FFFFFF; --coast:#FFFFFF;
  --home:#FFC9D6; --home-line:#B8305E;
  --visited:#D6336C; --visited-2:#E8558A; --visited-line:#A31D50; --planned:#F2A5BC;
  --pin:#3B1F33; --pin-ring:#FFF6F7; --pin-side:#9C6A80;
  --surface:#FFF6F7; --surface-2:#FCE7EC; --line:#F3D3DB; --field:#FFFFFF;
  --ink:#3B1F33; --ink-2:#8A5F73; --ink-3:#B48FA0;
  --accent:#E0407A; --accent-ink:#FFF6F7;
  --danger:#B3261E;
  --p1:#5A7BDB; --p2:#E0407A; --p3:#E08A20; --p4:#2FB58F; --p5:#8B5AC9; --p6:#3D8D3E;
  --guest-bg:#F8E1E7; --guest-ink:#8A5F73;
  --shadow:0 -6px 24px rgba(184,48,94,.18);
  --map-label:#8A5F73; --sea-label:#C98BA4;
}
:root[data-theme="rosa"] .btn{border-radius:999px}

*{box-sizing:border-box}
/* manipulation tar bort iOS dubbeltapp-zoom men behåller panorering och nyp,
   så sidan inte kan fastna inzoomad. Kartan sätter egen touch-action. */
html,body,#app,#tabs,.view,.sheet-body,.edbody,.months,#imBody{touch-action:manipulation}
html,body{height:100%;margin:0}
@supports (height: 100dvh){ html,body{height:100dvh} }
body{background:var(--ocean);color:var(--ink);font:15px/1.45 Figtree,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",Figtree,"Helvetica Neue",Arial,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* ---------- Lås ---------- */
#lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--ocean);padding:24px}
#lock .box{width:100%;max-width:340px;background:var(--surface);border-radius:18px;padding:28px 22px;box-shadow:0 12px 40px rgba(27,39,51,.16);text-align:center}
#lock h1{font-size:24px;margin-bottom:4px}
#lock p{color:var(--ink-2);font-size:14px;margin:0 0 18px}
#lock .globe{font-size:40px;line-height:1;margin-bottom:10px}
#lock form{display:flex;flex-direction:column;gap:10px}
#lock .err{color:var(--danger);font-size:13px;min-height:18px;margin:0}
#lock .status{color:var(--ink-2);font-size:13px;margin:0;display:flex;align-items:center;justify-content:center;gap:8px}
#lock .status[hidden]{display:none}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.4s}}

/* ---------- Formulärelement ---------- */
input[type=text],input[type=date],input[type=password],input[type=number],input[type=email],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--field);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.35}
textarea{resize:vertical;min-height:72px;line-height:1.45}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 4px}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{border-color:transparent;background:var(--surface-2);color:var(--ink)}
.chip .av{width:24px;height:24px;font-size:11px}
.chip.plain{padding:6px 12px}
.check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.hint{font-size:12.5px;color:var(--ink-3);margin:4px 0 0}

/* ---------- Skelett ---------- */
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
#stage{position:relative;flex:1;min-height:0;min-width:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#map .sea{fill:url(#seaGrad)}
#map .coast{fill:none;stroke:var(--coast);stroke-linejoin:round;opacity:.9}
/* Ingen stroke-width här: CSS vinner över presentationsattribut, och bredden
   räknas fram per zoomnivå i rescale(). Sätts den här skalas linjerna med kartan. */
#map .land{fill:var(--land);stroke:var(--land-line)}
#map .land.home{fill:var(--home);stroke:var(--home-line)}
#map .land.visited{fill:url(#visGrad);stroke:var(--visited-line)}
#map .land.planned{fill:url(#hatch)}
#map .land.hit{cursor:pointer}
#map .link{fill:none;stroke:var(--pin-side);stroke-dasharray:3 3}
#map .pin circle{fill:var(--pin);stroke:var(--pin-ring);cursor:pointer}
#map .pin.side circle{fill:var(--pin-side)}
#map .pin.city circle{fill:var(--visited);stroke:var(--pin-ring)}
#map .pin.planned circle{fill:var(--pin-ring);stroke:var(--pin)}
#map .pin.active circle{fill:var(--accent);stroke:var(--accent-ink)}
#map .pin.dim{opacity:.18}
#map .home-pin{cursor:pointer}
#map .home-pin circle{fill:var(--home-line);stroke:var(--land-line)}
#map .home-pin path{fill:none;stroke:var(--land-line);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
#map .clabel{fill:var(--map-label);font-family:Figtree,"Helvetica Neue",Arial,sans-serif;font-weight:600;paint-order:stroke;stroke:var(--land-line);stroke-linejoin:round;pointer-events:none}
#map .sealabel{fill:var(--sea-label);font-family:Figtree,"Helvetica Neue",Arial,sans-serif;font-style:italic;font-weight:400;text-anchor:middle;pointer-events:none}
#map .conlabel{fill:var(--map-label);font-family:Figtree,"Helvetica Neue",Arial,sans-serif;font-weight:500;text-anchor:middle;pointer-events:none;opacity:.8}
#map.picking{cursor:crosshair}
#map.picking .land,#map.picking .pin circle{cursor:crosshair}

/* ---------- Kartans överlägg ---------- */
body.no-top #top{display:none}
body.no-top #view-settings{padding-top:calc(12px + env(safe-area-inset-top,0px))}
#top{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;flex-direction:column;gap:10px;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:calc(16px + env(safe-area-inset-left,0px));
  padding-right:calc(16px + env(safe-area-inset-right,0px))}
#top>*{pointer-events:auto}
.toprow{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:7px;background:var(--surface);padding:7px 12px 7px 14px;
  border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.08);max-width:100%;min-width:0}
.brand h1{font-size:17px;font-weight:700;flex:none}
.brand .dot{color:var(--ink-3);flex:none}
.brand .sel{color:var(--ink-2);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand .chev{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .18s}
.brand[aria-expanded="true"] .chev{transform:rotate(180deg)}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.08);flex:none}
.iconbtn svg{width:19px;height:19px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cloud{width:10px;height:10px;border-radius:50%;background:var(--ink-3);flex:none;box-shadow:0 0 0 3px var(--surface)}
.cloud.on{background:#1F9A78}
.cloud.off{background:var(--danger)}
.whomenu{align-self:flex-start;background:var(--surface);border-radius:16px;padding:6px;
  box-shadow:0 8px 28px rgba(0,0,0,.18);min-width:232px;max-width:calc(100vw - 32px)}
.whomenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;
  font-size:15px;color:var(--ink);text-align:left}
.whomenu button:hover{background:var(--surface-2)}
.whomenu button .av{width:26px;height:26px;font-size:12px}
.whomenu button .tick{margin-left:auto;width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);
  display:grid;place-items:center;flex:none}
.whomenu button[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.whomenu button[aria-pressed="true"] .tick svg{display:block}
.whomenu button .tick svg{display:none;width:12px;height:12px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.whomenu hr{border:0;border-top:1px solid var(--line);margin:5px 8px}
.whomenu .lead{font-size:12.5px;color:var(--ink-3);padding:2px 10px 6px}
.av{display:inline-flex;align-items:center;justify-content:center;text-align:center;
  width:26px;height:26px;border-radius:50%;background:var(--pc,var(--ink-3));color:#fff;
  font:600 12px/1 "Bricolage Grotesque",sans-serif;flex:none;overflow:hidden}
/* Versalerna hamnar en aning högt i radboxen – skjut ned dem till optisk mitt */
.av>i{font-style:normal;line-height:1;transform:translateY(.07em)}
.av.guest{background:var(--guest-bg);color:var(--guest-ink);box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.avs .more{display:inline-grid;place-items:center;height:22px;min-width:22px;padding:0 5px;border-radius:999px;background:var(--guest-bg);color:var(--guest-ink);font:600 10px/1 "Bricolage Grotesque",sans-serif;margin-left:-6px;border:2px solid var(--surface)}
.zoom{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:calc(56px + env(safe-area-inset-top,0px));display:none;flex-direction:column;background:var(--surface);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden}
.zoom button{width:34px;height:34px;font-size:18px;line-height:1}
.zoom button+button{border-top:1px solid var(--line)}
.legend{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:12px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);background:var(--surface);padding:8px 10px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.legend .l-h{background:var(--home);border:1px solid var(--home-line)} .legend .l-v{background:var(--visited)} .legend .l-p{background:repeating-linear-gradient(135deg,var(--planned) 0 2px,var(--land) 2px 4px)} .legend .l-s{background:var(--pin-side);border-radius:50%}
#pickbar{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));bottom:16px;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:6}
#pickbar span{flex:1;font-size:14px}

/* ---------- Sök ---------- */
.srch{position:relative;min-width:0}
.srch .in{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;border-radius:999px;background:var(--field);border:1px solid var(--line)}
.srch .in:focus-within{border-color:var(--accent)}
.srch .in>svg{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.srch input{flex:1;min-width:0;height:100%;padding:0;border:0;border-radius:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.srch input::-webkit-search-cancel-button,.srch input::-webkit-search-decoration{-webkit-appearance:none}
.srch input:focus-visible{outline:none}
.srch .clr{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);flex:none}
.srch .clr svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.srch-res{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:8;background:var(--surface);border-radius:14px;
  box-shadow:0 8px 28px rgba(0,0,0,.18);max-height:min(52vh,400px);overflow-y:auto;overscroll-behavior:contain}
.srch-res [role=option]{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.srch-res [role=option]:last-child{border-bottom:0}
.srch-res [role=option][aria-selected="true"],.srch-res [role=option]:hover{background:var(--surface-2)}
.srch-res .flag{font-size:20px;line-height:1;text-align:center}
.srch-res b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch-res small{display:block;color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch-res mark{background:transparent;color:var(--accent)}
.srch-res .kind{font-size:11px;font-weight:600;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.srch-res .msg{margin:0;padding:12px 14px;font-size:13.5px;color:var(--ink-3)}
.view .srch{margin:0 0 14px}
/* På kartan: förstoringsglaset byter ut toppraden mot fältet */
#top .searchrow{display:none;align-items:center;gap:8px}
#top .searchrow .srch{flex:1}
#top .searchrow .in{border:0;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.08)}
#top .searchrow .cancel{flex:none;height:40px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.08);font-weight:600;color:var(--ink-2)}
#top.searching .toprow{display:none}
#top.searching .searchrow{display:flex}

/* ---------- Bottenark ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;
  box-shadow:var(--shadow);height:50%;display:flex;flex-direction:column;
  transition:height .28s cubic-bezier(.2,.8,.2,1);touch-action:none}
#sheet.dragging{transition:none}
.handle{flex:none;display:flex;align-items:center;justify-content:center;height:34px;width:100%;
  touch-action:none;cursor:grab}
.handle:active{cursor:grabbing}
.handle span{width:44px;height:5px;border-radius:3px;background:var(--line);transition:background .15s}
.handle:hover span,#sheet.dragging .handle span{background:var(--ink-3)}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:4px calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
@media (prefers-reduced-motion: reduce){#sheet{transition:none}}

/* ---------- Nyckeltal ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-bottom:6px}
.stat{background:var(--surface-2);border-radius:12px;padding:9px 8px;min-width:0}
.stat .num{font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2 .stat{padding:10px 12px}
.grid2 .stat span{white-space:normal}
@media (min-width:420px){ .stats{gap:8px} .stat{padding:10px 12px} .stat .num{font-size:24px} }

/* ---------- Reserader ---------- */
h2.sec{font-size:15px;color:var(--ink-2);font-weight:600;margin:16px 0 6px}
h2.sec:first-child{margin-top:8px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 6px}
.sechead h2{font-size:15px;color:var(--ink-2);font-weight:600}
.trip{display:grid;grid-template-columns:34px 1fr auto;gap:0 12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.trip:last-child{border-bottom:0}
.trip .flag{font-size:24px;line-height:1;text-align:center}
.trip b{display:block;font-weight:600}
.trip small{color:var(--ink-2);font-size:13px}
.trip .avs{display:flex}
.trip .avs .av{width:22px;height:22px;font-size:10px;margin-left:-6px;border:2px solid var(--surface)}
.trip.planned .flag{filter:grayscale(1);opacity:.7}
.trip.has-thumb{grid-template-columns:52px 1fr auto}
